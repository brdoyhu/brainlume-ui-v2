<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainlume · V2 完整页面设计</title><style>*{box-sizing:border-box}body{margin:0;background:#142037;color:#e4eafa;font-family:Avenir,-apple-system,sans-serif}header{padding:32px 38px 25px;border-bottom:1px solid #576e9544;display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:26px;font-weight:500;margin:7px 0 10px}header p{font-size:13px;color:#b5c8df;margin:0;line-height:1.7}small{font-size:10px;letter-spacing:2px;color:#b6b0fa}a{color:#b7c8f9;text-decoration:none;font-size:12px}header a{border:1px solid #7189b266;border-radius:25px;padding:13px 18px;white-space:nowrap}.tabs{position:sticky;top:0;z-index:3;background:#142037ee;backdrop-filter:blur(15px);padding:18px 38px;display:flex;gap:10px;flex-wrap:wrap}.tabs button{border:1px solid #6d83a966;background:transparent;color:#b8cbe2;padding:12px 18px;border-radius:25px;white-space:nowrap;min-height:44px;font:inherit;font-size:12px}.tabs button.active{background:#59669c;color:white;border-color:#8c9acb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:35px 26px;padding:18px 38px 50px;max-width:1740px;margin:auto}.item{min-width:0}.label{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;gap:10px}.label h2{font-size:13px;font-weight:500;margin:0}.label span{color:#93a9c8;font-size:10px;margin-right:8px}.frame{width:312px;height:676px;overflow:hidden;border:1px solid #8295bc55;border-radius:30px;background:#202c50;box-shadow:0 16px 35px #0002}iframe{width:390px;height:844px;border:0;transform:scale(.8);transform-origin:0 0}.item>p{font-size:11px;color:#a5bad4;line-height:1.6}.foot{font-size:12px;line-height:1.8;color:#a7bdd8;padding:0 38px 35px;max-width:1100px}button:focus-visible,a:focus-visible{outline:2px solid #c1bbfa;outline-offset:4px}@media(max-width:700px){header{padding:24px;display:block}header a{display:inline-block;margin-top:18px}.tabs{padding:15px 24px}.grid{padding:15px 24px;display:flex;overflow-x:auto;align-items:flex-start}.item{flex:0 0 312px}.foot{padding:20px 24px}}</style></head><body><header><div><small>BRAINLUME / SELECTED DIRECTION / QUIET BLUE</small><h1>V2 · 完整页面与状态</h1><p>已按当前发布 UE 同步，延续 Quiet Blue。每个画板支持独立滚动和点击。</p></div><a href="board.html">返回四个主页面 ↗</a></header><nav class="tabs" aria-label="页面分组"></nav><main class="grid"></main><p class="foot">沿用项目保存的新版 UE 页面编号；后缀标识本轮拆出的连接与异常状态，不等同于旧版 33 页编号。所有读数、设备连接和账户交互均为设计示例。法律文案仍为待提供的内容布局。</p><script>const groups=[["本轮 UE 更新", [["home","03","首页双任务",""],["result","05","双指标与三圆环",""],["self","04b","点选后查看结果",""],["measure","04","安静检测与三通道展开",""],["complete","07","竖向前后对比",""],["profile","01b","相邻肤色多选",""],["failure","10c","检测数据不足","single-failure"]]],["准备与检测", [["activate", "02b", "连接准备", ""], ["connect", "02b-1", "发现设备", ""], ["connect", "02b-1e", "连接失败", "pair-failed"], ["wear", "04a", "佩戴引导", ""], ["signal", "04a-1", "三通道接触检查", ""], ["signal", "04a-1e", "调整 CH2 接触", "poor-contact"], ["measure", "04", "三通道检测", ""], ["self", "04b", "检测后自评", ""]]], ["干预与结果", [["before", "06a", "Before 检测", ""], ["light", "06b", "Light Session", ""], ["after", "06c", "After 检测", ""], ["complete", "07", "前后对比", ""], ["report", "07b", "详细报告", ""], ["complete", "07h", "历史详情", "history"], ["complete", "07s", "仅有历史摘要", "summary-only"]]], ["异常与恢复", [["measure", "04p", "检测暂停", "paused"], ["after", "06c-d", "断连与恢复", "disconnected"], ["light", "06b-e", "安全结束确认", "end"], ["partial", "10b", "安全结束结果", ""], ["failure", "10", "After 数据不足", ""], ["complete", "07l", "可比性有限", "limited"], ["trends", "08e", "趋势空状态", "empty"]]], ["账户与设置", [["splash", "00", "启动", ""], ["welcome", "00b", "欢迎", ""], ["email", "00c", "邮箱", ""], ["password", "00c-1", "密码", ""], ["forgot", "00c-2", "重设密码", ""], ["sent", "00c-3", "邮件确认", ""], ["verify", "00d", "邮箱验证", ""], ["first", "01", "首次设置", ""], ["profile", "01b", "个人校准", ""], ["privacy", "02", "数据偏好", ""], ["device", "09", "设备与设置", ""], ["device", "09o", "设备离线", "offline"], ["terms", "00c-a", "条款阅读布局", ""]]]];const tabs=document.querySelector('.tabs'),grid=document.querySelector('.grid');const groupKeys=['updates','measurement','recovery','exceptions','account'];function show(n){tabs.innerHTML=groups.map(([t],i)=>`<button class="${i===n?'active':''}" aria-pressed="${i===n}" data-n="${i}">${t}</button>`).join('');grid.innerHTML=groups[n][1].map(([s,id,t,state])=>{const url='index.html?screen='+s+(state?'&state='+state:'');return `<article class="item"><div class="label"><h2><span>${id}</span>${t}</h2><a href="${url}">打开 ↗</a></div><div class="frame"><iframe loading="lazy" title="${t}" src="${url}&embed=1"></iframe></div><p>${state?'独立状态预览 · 可交互恢复':'沿用 UE 编号 · 可点击与滚动'}</p></article>`}).join('')}function fromHash(){const n=groupKeys.indexOf(location.hash.slice(1));show(n<0?0:n)}tabs.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b){location.hash=groupKeys[Number(b.dataset.n)];}});addEventListener('hashchange',fromHash);fromHash();</script></body></html>
